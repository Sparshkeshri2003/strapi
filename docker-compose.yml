version: '3.8'

services:
  strapi:
    container_name: strapi-app
    build: .
    image: strapi:latest
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: sqlite
      NODE_ENV: development
      JWT_SECRET: your-jwt-secret
      ADMIN_JWT_SECRET: your-admin-jwt-secret
      APP_KEYS: key1,key2,key3,key4
    ports:
      - '1337:1337'
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - strapi-network

networks:
  strapi-network:
    driver: bridge
